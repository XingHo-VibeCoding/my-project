<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}群消息智能提醒助手{% endblock %}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* 次要文字色：白底小字对比度 5.30:1，满足 WCAG AA 4.5:1（Day 9 设计规则） */
    --text-muted: #6b6b70;
    --accent: #d85a30;
  }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f6f8; color: #2c2c2e; padding: 20px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* ===== Day 13：三个视图共用的顶部导航栏 =====
     - 当前页用 aria-current="page" 标记（可访问性：读屏软件会报「当前页」）
     - :focus-visible 键盘焦点环，跟 Day 12 筛选区同一套规则 */
  nav.topnav {
    background: #fff; border-radius: 12px; padding: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
  }
  nav.topnav a {
    flex: 1 1 100px; text-align: center; text-decoration: none;
    color: var(--text-muted); font-size: 13px;
    padding: 8px 10px; border-radius: 8px; white-space: nowrap;
  }
  nav.topnav a:hover { background: #f0f1f3; color: #2c2c2e; }
  nav.topnav a[aria-current="page"] { background: #faeeda; color: #854f0b; font-weight: 600; }
  nav.topnav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.page { text-align: center; margin-bottom: 24px; }
  header.page h1 { font-size: 20px; font-weight: 600; }
  header.page p { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }

  footer.page {
    text-align: center; font-size: 11px; color: var(--text-muted);
    margin-top: 26px; line-height: 2; overflow-wrap: break-word;
  }
  footer.page a { color: var(--text-muted); }

  /* 各页面自己的样式写在这个 block 里 */
  {% block page_css %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav" aria-label="页面导航">
    <a href="/inbox"{% if nav == 'inbox' %} aria-current="page"{% endif %}>📥 收件箱</a>
    <a href="/timeline"{% if nav == 'timeline' %} aria-current="page"{% endif %}>⏰ 时间线</a>
    <a href="/settings"{% if nav == 'settings' %} aria-current="page"{% endif %}>⚙️ 设置</a>
  </nav>

  <header class="page">
    <h1>{% block page_title %}{% endblock %}</h1>
    <p>{% block page_sub %}{% endblock %}</p>
  </header>

  {% block content %}{% endblock %}

  <footer class="page">{% block footer %}{% endblock %}</footer>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
