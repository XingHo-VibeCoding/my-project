<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: var(--font-sans)">
<title>群消息智能提醒助手数据流图</title>
<desc>从微信群出发，依次经安卓通知栏、SmsForwarder 转发、穿透地址到达电脑后端 FastAPI，依次经 F1 解析写 messages、F2 AI 判断写 judgments，最终由 F3 推 Bark、F4 时间线消费；闲聊直接丢弃。</desc>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">群消息智能提醒助手 — 数据流图</text>
<text x="340" y="42" text-anchor="middle" font-size="11" fill="#5F5E5A">数据从哪来 → 到哪去 → 在哪被加工</text>

<rect x="30" y="70" width="100" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="80" y="92" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">微信群</text>

<rect x="170" y="70" width="140" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="240" y="92" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">安卓通知栏</text>

<rect x="350" y="70" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="92" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">SmsForwarder</text>

<rect x="20" y="150" width="640" height="160" rx="12" fill="#FAFCFE" stroke="#378ADD" stroke-width="1" stroke-opacity="0.5"/>
<text x="40" y="170" font-size="13" font-weight="500" fill="#0C447C">后端 FastAPI（本机常驻 · SQLite）</text>

<rect x="40" y="190" width="100" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="90" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">F1 接收解析</text>

<rect x="160" y="190" width="100" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="210" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">messages 表</text>

<rect x="40" y="240" width="100" height="36" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="90" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#4A1B0C">F2 AI 判断</text>

<rect x="160" y="240" width="100" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="210" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">judgments 表</text>

<rect x="320" y="190" width="280" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="212" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">F3 + F4 出口</text>
<text x="460" y="234" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">F3：仅 important → Bark 推送</text>
<text x="460" y="254" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">F4：聚合重要项 → 时间线页面</text>
<text x="460" y="278" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">闲聊丢弃（不进 F3/F4）</text>

<text x="40" y="328" font-size="11" fill="#5F5E5A">F2 输出三类：important / normal / chat，仅 important 进入下游消费。</text>

<rect x="350" y="345" width="120" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="410" y="367" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4B1528">Bark Server</text>

<rect x="490" y="345" width="120" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="550" y="367" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">手机浏览器</text>

<rect x="350" y="405" width="120" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="410" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4B1528">手机 Bark App</text>

<line x1="130" y1="92" x2="170" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="310" y1="92" x2="350" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 440,114 L 440,140 L 90,140 L 90,190" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="260" y="134" text-anchor="middle" font-size="10" fill="#5F5E5A">经穿透地址（HTTPS）</text>

<line x1="140" y1="208" x2="160" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="90" y1="226" x2="90" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="140" y1="258" x2="160" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 260,258 L 290,258 L 290,220 L 320,220" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>

<path d="M 410,290 L 410,345" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 510,290 L 510,320 L 550,320 L 550,345" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="410" y1="389" x2="410" y2="405" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>